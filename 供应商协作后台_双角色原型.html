    <header class="topbar"><div class="brand"><span class="brand-mark">C</span> CMT 服务网络 <small>供应商协作后台</small></div><div class="spacer"></div><div class="notification" id="notificationShell" hidden><button class="icon-btn notification-trigger" type="button" title="通知" aria-label="通知" aria-expanded="false" onclick="toggleNotifications()"><i data-lucide="bell"></i><span class="notification-dot" id="notificationDot" hidden></span></button><div class="notification-panel" id="notificationPanel" hidden></div></div><div class="user"><span class="avatar" id="userAvatar">苏</span><span id="userName">苏州康养旅行社</span><button class="icon-btn" type="button" title="退出登录" aria-label="退出登录" onclick="logout()"><i data-lucide="log-out"></i></button></div></header>
    <main id="main"></main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><h2 id="modalTitle">提示</h2><button class="icon-btn" aria-label="关闭" onclick="closeModal()"><i data-lucide="x"></i></button></header><div class="content" id="modalContent"></div><footer class="footer" id="modalFooter"></footer></section></div>
  <div class="toast" id="toast" role="status"></div>
  
  <script>
    const types={hospital:'医院 / 医疗机构',travel:'旅行社 / 地接社',escortCo:'陪诊机构',escort:'个人陪诊员'};
    var TABS_H = {
  strong_depts: { title: "2.1 强势科室盘点", hint: "逐科建一行，疗效类表述须取证（样本量/统计年份/有无文献），院方口头自述且无第三方验证的数字不得对外宣传", cols: ["科室", "主推病种 / 术式", "强势点（设备/年量/资质）", "院方自认拳头排序", "与 CMT 匹配度 ●/○/✕", "取证备注"] },
  doctors:     { title: "2.2 优势医生档案", hint: "出镜访谈、真名与职称使用需书面授权；手术室拍摄通常受限", cols: ["姓名", "科室 / 职称头衔", "擅长方向 / 年案例量", "可对外宣传口径", "英文简介 + 授权照片", "能否出镜（授权）"] }
};
var TABS_T = {
  t_products: { title: "主推产品 / 线路明细", hint: "把对方能卖的产品逐行列出来，含医疗/康养节点的是合作重点", cols: ["产品 / 线路名", "城市", "天数", "参考客单价（元/人）", "是否含康养 / 医疗节点", "适合人群"] }
};
var TABS_E = {};   // 个人陪诊无动态表
var TABS_EC = {};  // 陪诊机构无动态表

/* 供应商类型元数据 */
var SUP = {
  hospital:  { label: "医院", tab: "hospital" },
  travel:    { label: "旅行社", tab: "travel" },
  escort:    { label: "陪诊员", tab: "escort" },
  escortCo:  { label: "陪诊机构", tab: "escortCo" }
};
var SUP_KEYS = { hospital:1, travel:1, escort:1, escortCo:1 };
function typeOf(h) { return (h && SUP_KEYS[h.type]) ? h.type : "hospital"; }
function groupsOf(t) { return t === "travel" ? GROUPS_T : (t === "escort" ? GROUPS_E : (t === "escortCo" ? GROUPS_EC : GROUPS_H)); }
function tabsOf(t) { return t === "travel" ? TABS_T : (t === "escort" ? TABS_E : (t === "escortCo" ? TABS_EC : TABS_H)); }

/* 医院问卷结构（kind: 默认单行文本 / ta 多行 / toggle 单项勾选 / check 多项勾选+其他） */
var GROUPS_H = [
  { key: "G0", title: "0 · 医院基础档案", note: "谈合作前先建卡。每家医院谈前必做三动作：① 主推科室与 CMT 目录逐项比标匹配度；② 肿瘤线按对方实际设备换讲法；③ 把院方自认的拳头项目列为「共建品类」优先谈。", items: [
    { id: "name",      label: "医院全称" },
    { id: "nature",    label: "性质", kind: "check", opts: ["公立三甲", "私立", "港资"] },
    { id: "cred",      label: "涉外资质", kind: "check", opts: ["JCI", "CIHA", "涉外医疗试点", "港澳药械通", "国际部独立核算"] },
    { id: "contact",   label: "国际部对接人 + 直连方式" },
    { id: "insnet",    label: "商保直付网络（家数 + 书面名单）", kind: "ta" },
    { id: "lang",      label: "语言能力（官网列 + 会上补充，分开记）", kind: "ta" },
    { id: "src",       label: "信息来源文件清单（官网页面 / 物料 / 纪要路径）", kind: "ta" }
  ]},

  { key: "G11", title: "一 · 服务体系 ｜ 1.1 商业保险直付与报销", note: "⚠️ 前提纠偏：直付能力按保险公司 / 保单划分，不按患者国籍划分。问法从「覆盖哪些国家」改为「覆盖哪些保险公司」。", items: [
    { id: "a_ins_list",  label: "直付合作保险公司", hint: "要书面名单，不只「40+ 家」；点名确认 Bupa / MSH / AIA / Cigna / Allianz 是否在内", kind: "ta" },
    { id: "a_ins_scope", label: "可直付的服务范围", kind: "check", opts: ["全部科室", "仅国际部", "门诊", "住院", "体检", "中医", "医美"] },
    { id: "a_ins_flow",  label: "直付流程与时限", hint: "预授权（GOP）谁发起、提前多久、答复时限；无预授权是否拒赔", kind: "ta" },
    { id: "a_ins_self",  label: "自付部分规则", kind: "check", opts: ["免赔额", "共付", "超限部分", "治疗前结清"] },
    { id: "a_ins_spec",  label: "特殊支付通道", kind: "check", opts: ["香港长者医疗券", "跨境医疗保险"] },
    { id: "a_ins_reim",  label: "非直付客户的报销材料", hint: "英文病历摘要 / 逐项明细账单 / 诊断证明 / 出院小结能否出具？时限？翻译收费？", kind: "ta" }
  ]},

  { key: "G12", title: "一 · 服务体系 ｜ 1.2 渠道客户接待 SOP", note: "分工原则：CMT 锁最前端的病历整理 + 医学翻译 + 全流程协调；院方锁诊疗环节。报价按「分级报价」谈。", items: [
    { id: "a_sop_lead",   label: "线索触发", hint: "送客入口（对接人/邮件/系统）？多久首次响应？", kind: "ta" },
    { id: "a_sop_file",   label: "病历收集与翻译（CMT 主责）", hint: "影像要 DICOM 还是 JPG？要英文病理报告？接受患者本地语种原件吗？", kind: "ta" },
    { id: "a_sop_review", label: "远程评估", hint: "反馈时效（X 个工作日）？收费？", kind: "ta" },
    { id: "a_sop_q1",     label: "报价节点 ① 预评估 / 预报价", hint: "主诉 + 已有报告能否直接给预评估价", kind: "ta" },
    { id: "a_sop_q2",     label: "报价节点 ② 正式报价", hint: "哪些案必须到院检查确认后才出正式价", kind: "ta" },
    { id: "a_sop_q3",     label: "报价效力", hint: "报价单有效期多久？超预估时告知确认流程？", kind: "ta" },
    { id: "a_sop_visa",   label: "签证与行程", kind: "check", opts: ["邀请函院方出", "行程 CMT 出"] },
    { id: "a_sop_pick",   label: "落地接待", kind: "check", opts: ["接机免费", "送机免费", "院内陪诊", "CMT 陪诊"] },
    { id: "a_sop_hosp",   label: "院内协调", kind: "check", opts: ["指定主诊医生", "优先排床"] },
    { id: "a_sop_fu",     label: "出院后随访", hint: "谁做、几次、是否收费", kind: "ta" }
  ]},
  { key: "G12T", title: "CMT 侧需跟进的项目（勾选）", items: [
    { id: "c_collect", label: "收集病例", kind: "toggle" },
    { id: "c_trans",   label: "小语种翻译", kind: "toggle" },
    { id: "c_book",    label: "预约协调", kind: "toggle" },
    { id: "c_quote",   label: "报价解读", kind: "toggle" },
    { id: "c_escort",  label: "陪诊安排", kind: "toggle" },
    { id: "c_life",    label: "院外生活安排", kind: "toggle" },
    { id: "c_follow",  label: "随访对接", kind: "toggle" }
  ]},

  { key: "G13", title: "一 · 服务体系 ｜ 1.3 可提供的语种服务", items: [
    { id: "a_lang_list", label: "院内常驻 / 可调用语种", kind: "check", opts: ["英语", "日语", "韩语", "俄语", "印尼语", "孟加拉语", "缅语", "越语", "泰语", "德语", "法语", "阿拉伯语"] },
    { id: "a_lang_how",  label: "提供方式", hint: "院内专职翻译 / 兼职 / 第三方外包？", kind: "ta" },
    { id: "a_lang_q",    label: "翻译资质", hint: "有无医学翻译背景？文件翻译与口头翻译是否同一批人？", kind: "ta" },
    { id: "a_lang_3",    label: "分层覆盖", hint: "线上问诊 / 院内陪诊 / 文件翻译三种是否都提供、分别如何收费", kind: "ta" },
    { id: "a_lang_cmt",  label: "CMT 兜底语种", kind: "check", opts: ["柬埔寨语", "老挝语", "尼泊尔语", "印地语", "阿拉伯语"] },
  ]},

  { key: "G14", title: "一 · 服务体系 ｜ 1.4 生活服务与宗教适配", note: "⚠️ 对东盟客群（印尼·孟加拉穆斯林为主，缅·泰佛教）是硬门槛，不是加分项。院方一句「尊重宗教习俗」不算数，要逐项落实。", items: [
    { id: "a_life_food", label: "宗教膳食", kind: "check", opts: ["清真", "素食", "印度餐", "犹太餐", "斋月专项"] },
    { id: "a_life_pray", label: "祈祷室", hint: "院内祈祷室 / 静室有无、位置、开放时间", kind: "ta" },
    { id: "a_life_time", label: "礼拜配合", hint: "每日礼拜时间能否避开检查治疗？能否允许宗教人士探访？", kind: "ta" },
    { id: "a_life_gend", label: "性别照护", hint: "穆斯林女性患者能否安排女性医护优先？", kind: "ta" },
    { id: "a_life_ward", label: "病房", hint: "单人病房？陪护床？能否按宗教 / 文化偏好安排", kind: "ta" },
    { id: "a_life_hotel",label: "非住院患者住宿", hint: "协议酒店有无、价位档、距院距离；长期住宿（术后/放化疗期）谁安排", kind: "ta" },
    { id: "a_life_fam",  label: "家属住宿", hint: "价格与距离（医院常只给「指引」，实际由 CMT 承接）", kind: "ta" },
    { id: "a_life_car",  label: "接送", kind: "check", opts: ["接机免费", "送机免费", "市内复诊接送"] },
    { id: "a_life_cmt",  label: "CMT 认领空白带（会上提出）", hint: "院外长期住宿 + 生活层翻译 + 复诊动线安排 —— 是否已主动认领", kind: "ta" }
  ]},

  { key: "G15", title: "一 · 服务体系 ｜ 1.5 国际患者费用报价口径", items: [
    { id: "a_price_mech", label: "定价机制", hint: "院内标准价 + 国际部加价系数，还是独立价目表？加价幅度多少（参考个案：某院检查≈医保 2 倍、治疗≈3 倍 ⚠️ 须逐院书面核实，不可当通用数）", kind: "ta" },
    { id: "a_price_list", label: "可分科价目", hint: "能否给可对外报价的分科价目表 / 打包价（重点：首期主推品类）", kind: "ta" },
    { id: "a_price_struct", label: "报价构成", hint: "医疗 / 药品 / 耗材 / 住院逐项列？是否允许打包（手术+住院+接送）", kind: "ta" },
    { id: "a_price_pay",  label: "支付与结算", hint: "押金比例？支持币种与支付方式？退费规则？", kind: "ta" },
    { id: "a_price_over", label: "超预估处理", hint: "费用超预估时，谁在什么节点告知患者、需否书面确认", kind: "ta" },
    { id: "a_price_long", label: "长疗程结算", hint: "放疗 / 细胞治疗等多次往返，按次结算还是整体报价", kind: "ta" }
  ]},

  { key: "G16", title: "一 · 服务体系 ｜ 1.6 线上问诊", items: [
    { id: "a_vc_price",  label: "单科价格", hint: "单价？是否分医生级别（主治 / 副高 / 正高 / 特需）？", kind: "ta" },
    { id: "a_vc_mdt",    label: "MDT 价格", hint: "多学科会诊价？涉及几科几位专家？提前几天约？", kind: "ta" },
    { id: "a_vc_pack",   label: "引流套餐", hint: "癌症筛查套餐等打包低门槛品？项目与价格？", kind: "ta" },
    { id: "a_vc_off",    label: "抵扣规则（重点）", hint: "能否抵后续诊疗费？全额还是部分？凭哪笔订单抵？有效期？限不限科室？", kind: "ta" },
    { id: "a_vc_ch",     label: "渠道专属", hint: "是否给渠道专属价 / 打包价 / 优先预约通道", kind: "ta" },
    { id: "a_vc_lang",   label: "问诊语种", hint: "小语种翻译如何加、加收多少", kind: "ta" }
  ]},

  { key: "G17", title: "一 · 服务体系 ｜ 1.7 医疗签证与文件", items: [
    { id: "a_visa_inv",  label: "医疗邀请函", hint: "能否出具邀请函 / 入院接收函？中英文？收费？出具时限？", kind: "ta" },
    { id: "a_visa_docs", label: "配套文件", hint: "诊断证明、预约确认、费用预估等使馆全套文件能否配合", kind: "ta" },
    { id: "a_visa_exp",  label: "实操经验", hint: "国际部有无办 D 类医疗签证的实操经验与模板", kind: "ta" },
    { id: "a_visa_fta",  label: "免签衔接", hint: "7 日内可走 240 小时过境 / 免签；15 / 30 日必须医疗签证——院方是否知晓并配合行程设计", kind: "ta" }
  ]},

  { key: "G21", title: "二 · 治疗优势与病患落地 ｜ 2.1 强势科室盘点（表格）", table: "strong_depts" },
  { key: "G22", title: "二 · 治疗优势与病患落地 ｜ 2.2 优势医生档案（表格）", table: "doctors" },

  { key: "G23", title: "二 · 治疗优势与病患落地 ｜ 2.3 肿瘤线优势细分（重点线）", note: "「细胞治疗」≠CAR-T，必须问到具体瘤种 / 靶点 / 制备资质 / 收费性质。", items: [
    { id: "b_onc_surg",  label: "外科手术", hint: "强势术式（腔镜 / 机器人等）？对应瘤种？", kind: "ta" },
    { id: "b_onc_med",   label: "化疗 / 内科", hint: "覆盖瘤种线？有无门诊 / 日间化疗中心（决定患者住 4 周还是每周往返）", kind: "ta" },
    { id: "b_onc_drug",  label: "药品可及性", hint: "进口 / 靶向 / 免疫药配备？是否支持患者自带药？用药方案谁定？", kind: "ta" },
    { id: "b_onc_cart",  label: "CAR-T（重点追问）", hint: "哪个瘤种？靶点（CD19 / BCMA…）？院内制备还是合作机构？常规收费还是仅临床研究入组？", kind: "ta" },
    { id: "b_onc_rt",    label: "放疗设备", kind: "check", opts: ["质子", "重离子", "射波刀", "伽玛刀", "LINAC", "热疗"] },
    { id: "b_onc_int",   label: "整合 / 康复", hint: "中医协同、肿瘤康复、营养支持能否打包（中西医结合医院差异化卖点）", kind: "ta" },
    { id: "b_onc_dur",   label: "在华周期", hint: "手术住院 / 放疗周期 / 系统治疗周期分开问，不得估", kind: "ta" }
  ]},

  { key: "G31", title: "三 · 与渠道的合作模式 ｜ 3.1 合作返点政策", note: "⚠️ 佣金基数口径（本组第 2 条）是全协议最关键的一条：不敲死定义边界，骨科 / 肿瘤等高耗材科室的基数可能被砍掉一半以上。", items: [
    { id: "c_comm_model", label: "合作模式", hint: "佣金（按有效收入 %）？底价 / 净价（医院给净价、CMT 自主加价、差价归 CMT）？打包价？", kind: "ta" },
    { id: "c_comm_base",  label: "佣金基数口径（最优先敲死）", hint: "「扣除耗材费、血费后的有效收入」——耗材定义：全部还是仅高值？药品算不算？植入物算不算？检查检验费算不算？血费界定？", kind: "ta" },
    { id: "c_comm_dept",  label: "科室差异", hint: "分科室返点是否不同？（TCM/康复人力型基数最实；骨科 / 肿瘤缩水最大）", kind: "ta" },
    { id: "c_comm_net",   label: "底价条件", hint: "底价模式是否要求最低量承诺（年送客数 / 年营业额）？账期与违约条款？", kind: "ta" },
    { id: "c_comm_inc",   label: "量价激励", hint: "达量后返点或价格能否上浮？", kind: "ta" }
  ]},

  { key: "G32", title: "三 · 与渠道的合作模式 ｜ 3.2 结算条款", items: [
    { id: "c_pay_sub",   label: "结算主体", hint: "医院付 CMT，还是经境外主体付？", kind: "ta" },
    { id: "c_pay_name",  label: "名目（合规红线）", hint: "必须是「市场推广服务费 / 咨询服务费」，协议与发票措辞一致；不得出现佣金 / 返佣 / 回扣 / 按人头抽成表述。备选：患者直接向 CMT 付费（更干净）", kind: "ta" },
    { id: "c_pay_inv",   label: "票据", hint: "CMT 开什么发票、类目、税率？需否境外主体开票？", kind: "ta" },
    { id: "c_pay_cyc",   label: "结算周期", hint: "单案结 / 月结 / 季结？患者结清后多久到账？", kind: "ta" },
    { id: "c_pay_cur",   label: "币种与汇率", hint: "人民币还是外币？汇率按哪天？", kind: "ta" },
    { id: "c_pay_ref",   label: "退费冲回", hint: "患者退费时，已结返点是否冲回？", kind: "ta" },
    { id: "c_pay_long",  label: "长疗程结算", hint: "多次往返疗程按次结还是整体结？", kind: "ta" }
